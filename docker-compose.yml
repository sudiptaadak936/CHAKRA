services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chakra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chakra_db}
      POSTGRES_USER: ${POSTGRES_USER:-chakra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chakra_secure_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chakra_user} -d ${POSTGRES_DB:-chakra_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chakra-network

  neo4j:
    image: neo4j:5-community
    container_name: chakra-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-chakra_neo4j_password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    ports:
      - "7474:7474" # HTTP UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - chakra-network

  redis:
    image: redis:7-alpine
    container_name: chakra-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - chakra-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chakra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./scripts:/app/scripts:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chakra_db}
      - POSTGRES_USER=${POSTGRES_USER:-chakra_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chakra_secure_password}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-chakra_neo4j_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRONGRID_API_KEY=${TRONGRID_API_KEY:-}
      - ETHERSCAN_API_KEY=${ETHERSCAN_API_KEY:-}
      - HELIUS_API_KEY=${HELIUS_API_KEY:-}
      - SOLSCAN_API_KEY=${SOLSCAN_API_KEY:-}
      - CHAINABUSE_API_KEY=${CHAINABUSE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chakra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: chakra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - chakra-network

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  chakra-network:
    driver: bridge